[project]
name = "ai-investment-copilot"
version = "0.1.0"
description = "An AI investment research assistant for learning and personal use."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare>=1.12",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "numpy",
    "openai>=1.0",
    "pandas",
    "pypdf",
    "python-dotenv",
    "streamlit>=1.30",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
ignore = ["RUF007"]

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
