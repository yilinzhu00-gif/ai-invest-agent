[project]
name = "ai-investment-copilot"
version = "0.1.0"
description = "An AI investment research assistant for learning and personal use."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare>=1.12",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "celery>=5.4,<6.0",
    "crewai>=1.0,<2.0",
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "numpy",
    "openai>=1.0",
    "pandas",
    "pydantic-settings>=2.7",
    "prometheus-client>=0.21,<1.0",
    "pypdf",
    "python-dotenv",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.2,<6.0",
    "streamlit>=1.30",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
document-worker = [
    "docling>=2,<3",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "httpx",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
ignore = ["RUF007"]

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
