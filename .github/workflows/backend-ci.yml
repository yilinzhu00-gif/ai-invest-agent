name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "*.py"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "*.py"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy backend/app legacy/scoring.py
      - run: uv run pytest -q
      - run: python scripts/check_streamlit_retirement.py
