name: Phase 8 production pipeline

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "docker/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/phase8-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # The deploy job cannot run until the same commit has passed both language
  # suites and the Compose contract check.
  test:
    name: Test backend, frontend and Compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy backend/app
      - run: uv run pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run build
      - name: Validate the five-service Compose contract
        run: |
          docker compose --env-file deploy/env/development.example config --quiet
          services="$(docker compose --env-file deploy/env/development.example config --services)"
          for required in frontend backend postgres redis vector-db; do
            grep -qx "$required" <<<"$services"
          done

  build-image:
    name: Build immutable backend and frontend images
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Log in to GHCR for main pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        run: docker build --tag "${IMAGE_PREFIX}/backend:${IMAGE_TAG}" --file backend/Dockerfile .
      - name: Build frontend image
        run: >-
          docker build --tag "${IMAGE_PREFIX}/frontend:${IMAGE_TAG}"
          --build-arg NEXT_PUBLIC_AUTH_MODE=development
          --file frontend/Dockerfile .
      - name: Push images for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE_PREFIX}/backend:${IMAGE_TAG}"
          docker push "${IMAGE_PREFIX}/frontend:${IMAGE_TAG}"

  deploy:
    name: Deploy to the configured production host
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the operator-provided SSH key and known hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/deploy-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
      - name: Pull the commit images, restart Compose and smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          BACKEND_IMAGE: ${{ env.IMAGE_PREFIX }}/backend:${{ env.IMAGE_TAG }}
          FRONTEND_IMAGE: ${{ env.IMAGE_PREFIX }}/frontend:${{ env.IMAGE_TAG }}
        run: |
          ssh -i "$RUNNER_TEMP/deploy-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$DEPLOY_URL" <<'REMOTE'
          set -eu
          deploy_path="$1"
          backend_image="$2"
          frontend_image="$3"
          deploy_url="$4"
          cd "$deploy_path"
          export BACKEND_IMAGE="$backend_image" FRONTEND_IMAGE="$frontend_image"
          docker compose --env-file .env -f deploy/compose.base.yml -f deploy/compose.prod.yml pull backend frontend
          docker compose --env-file .env -f deploy/compose.base.yml -f deploy/compose.prod.yml up -d --no-build
          ./scripts/smoke-test.sh "$deploy_url"
          REMOTE
